<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ảnh của bạn</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; align-items: center; justify-content: center; }
    img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <img id="pic" alt="">
  <script>
    // Sửa tên/đuôi ảnh ở đây nếu cần (ví dụ .png)
    const images = ["anh_1.jpg", "anh_2.jpg", "anh_3.jpg", "anh_4.jpg"];

    let n = 0;
    try {
      n = parseInt(localStorage.getItem("scanCount") || "0", 10);
      if (isNaN(n)) n = 0;
      localStorage.setItem("scanCount", String(n + 1));
    } catch (e) {
      // Dự phòng nếu trình duyệt chặn lưu trữ
      n = Math.floor(Math.random() * images.length);
    }
    document.getElementById("pic").src = images[n % images.length];
  </script>
</body>
</html>
